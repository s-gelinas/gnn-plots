output_dir: /project/6050429/sgelinas/salt/gnn-plots/output/GN3ej-combined-extLabels-fold0

samples: &samples
  Old samples:
    input_dir: '/project/def-mdanning/sgelinas/salt/salt/logs/GN3ej-oldSamples-extLabels-fold0-classdict_20250610-T130836/ckpts/lifetime'
    label: 'Old samples'
    df_name: jets
  New samples:
    input_dir: '/project/def-mdanning/sgelinas/salt/salt/logs/GN3ej-combined-extLabels-fold0-classdict_20250606-T150049/ckpts/lifetime'
    label: 'New samples'
    df_name: jets
  Epoch 0:
    input_dir: '/project/def-mdanning/sgelinas/salt/salt/logs/GN3ej-combined-extLabels-fold0-classdict_20250606-T150049/ckpts/lifetime_epoch0'
    label: 'New samples - epoch 0'
    df_name: jets

style: &style
  figsize: !!python/tuple [6, 4.5]  # figure sizes in this range work best
  label_fontsize: 13
  fontsize: 13
  atlas_first_tag: "Simulation Internal"
  atlas_second_tag: "$\\sqrt{{s}}=13.6$ TeV, $51.8$ fb$^{-1}$"
  atlas_fontsize: 14
  y_scale: 1.2
  grid: False

plots:
  eff_vs_lifetime:
    class: plotter.plot_classes.signal_eff_plot.SignalEffPlotBase
    samples: *samples
    range: !!python/tuple [0.95, 1, 100]
    target_label: isDisplaced
    cut_value: 0.98
    file_name: output/lifetime_eff.png # output
    style:
      <<: *style
      n_ratio_panels: 0
      ylabel: "EJ tagging efficiency for $p_\\mathrm{EJ} > 0.98$"
      xlabel: "Lifetime [mm]"

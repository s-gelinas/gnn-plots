style: &style
  figsize: !!python/tuple [8, 4.5] #[8, 4.5]  # figure sizes in this range work best
  label_fontsize: 13
  fontsize: 13
  atlas_first_tag: "Simulation Internal"
  atlas_second_tag: "$\\sqrt{{s}}=13.6$ TeV, $51.8$ fb$^{-1}$"
  atlas_fontsize: 14
  ymin: 1
  y_scale: 0.9
  grid: False

plots:
  roc:
    class: plotter.plot_classes.roc_plot.RocPlotBase
    samples: *samples
    file_name: output/GN3ej-combined-extLabels-fold0/roc_cuts_new.png
    target_label: isDisplaced
    tagger_output: GN2ej_pdispjet
    range: !!python/tuple [0.95, 1, 100]
    show_cuts: True  # choose whether to display your desired cuts
    leg_inside: False
    leg_fontsize: 12
    reference_label: "nominal"
    cut_values: [0.98]  # or None
    style:
      <<: *style
      n_ratio_panels: 0
      ylabel: "Background rejection "
      xlabel: "EJ tagging efficiency "
      y_scale: 1.3